<!doctype html><html lang="es"><meta charset="utf-8"><title>Sonido y guías por frases</title><style>body{font:14px system-ui;background:#101813;color:#f5e8ce;padding:20px}button{padding:14px}pre{white-space:pre-wrap}iframe{width:1200px;height:850px;max-width:100%}</style><h1>Sonido y guías por frases</h1><button id="run">Comprobar mejoras</button><pre id="report">Lista.</pre><iframe title="Aplicación real" src="/#practice"></iframe><script type="module">
import {createAccordionAudio} from '/src/recorded-accordion-audio.js';
const out=document.querySelector('#report'),frame=document.querySelector('iframe'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{const results=[];const check=(ok,label,details)=>{results.push({label,passed:!!ok,details});if(!ok)throw Error(label);out.textContent=JSON.stringify({running:true,results},null,2);};const until=async fn=>{const start=performance.now();while(!fn()){if(performance.now()-start>12000)throw Error('Timeout '+fn);await sleep(20);}};try{
 for(const [part,button] of [['melody','BTN_Melody_14'],['bass','BTN_Bass_01'],['chord','BTN_Bass_02']])for(const muted of [false,true]){
  const context=new OfflineAudioContext(2,48000,48000),audio=await createAccordionAudio({context,baseURL:new URL('/instrument/',location.origin)});await audio.preload();audio.setPlayingMode('direct');audio.setExpression(.8);audio.setTuning('GCF');audio.setSound({[part]:muted?0:1});audio.scheduleNote(button,'push',.1,.5);const rendered=await context.startRendering(),data=rendered.getChannelData(0).slice(12000,24000),rms=Math.sqrt(data.reduce((s,n)=>s+n*n,0)/data.length),peak=Math.max(...data.map(Math.abs));check(muted?rms<.00001:rms>.005,`${part}: ${muted?'mute real':'salida grabada'}`,{rms,peak});check(peak<.98,`${part}: margen de salida`);audio.dispose();
 }
 const win=frame.contentWindow,doc=frame.contentDocument,$=s=>doc.querySelector(s);await until(()=>$('[data-ready=true]'));win.Element.prototype.requestFullscreen=()=>Promise.reject(new DOMException('Fixture uses page fallback','NotAllowedError'));
 // Deterministic player adapter validates our reference controls, not YouTube availability or a transcription.
 let referenceTime=4,rate=1,seeks=[];win.YT={Player:class{constructor(el,config){this.config=config;setTimeout(()=>config.events.onReady(),10);}getCurrentTime(){return referenceTime;}getDuration(){return 240;}getAvailablePlaybackRates(){return [.5,.75,1];}setPlaybackRate(value){rate=value;}setVolume(){}playVideo(){this.config.events.onStateChange({data:1});}pauseVideo(){this.config.events.onStateChange({data:2});}seekTo(time){referenceTime=time;seeks.push(time);}destroy(){}}};
 [...doc.querySelectorAll('.p-tabs button')].find(b=>b.textContent.includes('Canciones')).click();await until(()=>$('.song-source-tabs')&&$('[aria-label="Afinación de práctica"]').value==='BEA');await sleep(120);[...doc.querySelectorAll('.song-source-tabs button')].find(b=>b.textContent.includes('Arreglo')).click();await until(()=>$('.phrase-list article')&&$('[aria-label="Afinación de práctica"]').value==='BEA');await sleep(120);check(doc.querySelectorAll('.phrase-list article').length>=2,'Guía divide la sección en frases');
 const second=doc.querySelectorAll('.phrase-list article')[1];second.querySelector('button').click();await sleep(60);const sought=Number($('.song-workspace').dataset.position);check(sought>0,'Seleccionar frase antes de reproducir conserva su posición',{sought});second.querySelectorAll('button')[1].click();await sleep(40);check(doc.querySelector('.song-advanced input[type=checkbox]').checked,'Repetir frase activa bucle A–B');
 const mode=$('[aria-label="Modo de canción"]');mode.value='watch';mode.dispatchEvent(new win.Event('change',{bubbles:true}));await sleep(40);$('.song-transport .p-primary').click();await until(()=>$('.song-workspace').dataset.phase==='playing');check(Number($('.song-workspace').dataset.position)>=sought-.1,'El primer inicio respeta la frase elegida');await until(()=>Number($('.practice-app').dataset.audioRms)>.003);check(true,'La frase automática produce señal en la app');$('.p-full-note button').click();await sleep(40);$('[aria-label="Salir de pantalla grande"]').click();await sleep(40);
 [...doc.querySelectorAll('.song-source-tabs button')].find(b=>b.textContent.includes('Grabación')).click();await until(()=>$('[aria-label="Velocidad de referencia"]:not(:disabled) option[value="0.5"]'));const speed=$('[aria-label="Velocidad de referencia"]');speed.value='0.5';speed.dispatchEvent(new win.Event('change',{bubbles:true}));check(rate===.5,'Referencia solicita velocidad disponible de 0,5×');[...doc.querySelectorAll('.reference-guide button')].find(b=>b.textContent.includes('Marcar A')).click();await sleep(30);referenceTime=7;[...doc.querySelectorAll('.reference-guide button')].find(b=>b.textContent.includes('Marcar B')).click();await sleep(30);const loop=$('[aria-label="Repetir referencia A-B"]');loop.click();[...doc.querySelectorAll('.reference-guide button')].find(b=>b.textContent.includes('Escuchar desde A')).click();await sleep(30);referenceTime=7.2;await until(()=>seeks.filter(t=>t===4).length>=2);check(true,'Bucle de referencia vuelve al inicio marcado (adaptador simulado)');check(!$('.song-note-timeline'),'La referencia original no recibe notas inventadas');
 out.textContent=JSON.stringify({passed:true,scope:'Production sampler and mounted app. Reference controls use an explicit deterministic player adapter; no commercial transcription or listening claim.',checks:results.length,results},null,2);
 }catch(error){out.textContent=JSON.stringify({passed:false,error:String(error),results},null,2);}};
</script></html>
