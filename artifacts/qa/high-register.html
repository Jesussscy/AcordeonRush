<!doctype html><html lang="es"><meta charset="utf-8"><title>Vallenato y Vallenato agudo</title><style>body{font:15px system-ui;background:#101813;color:#f5e8ce;padding:20px}pre{white-space:pre-wrap}audio{display:block;width:600px;max-width:100%}button,a{padding:12px;color:#c9ad7b}</style><h1>Comparación del registro agudo</h1><p>La misma tecla: cerrado y abierto. Primeros seis segundos: Vallenato anterior. Desde el segundo siete: Vallenato agudo. Ambos fragmentos tienen el mismo RMS.</p><button id="run" disabled>Preparar comparación</button><pre id="report">Lista.</pre><div id="clips"></div><script type="module">
import {createAccordionAudio} from '/src/recorded-accordion-audio.js';
const report=document.querySelector('#report');function stats(data,a=0,b=data.length){let energy=0,slope=0,peak=0;for(let i=Math.max(a,1);i<b;i++){energy+=data[i]**2;slope+=(data[i]-data[i-1])**2;peak=Math.max(peak,Math.abs(data[i]));}return {rms:Math.sqrt(energy/(b-a)),highFrequencyRatio:slope/energy,peak};}
async function render(profile){const context=new OfflineAudioContext(2,48000*6,48000),audio=await createAccordionAudio({context,baseURL:new URL('/instrument/',location.origin)});await audio.preload();audio.setPlayingMode('direct');audio.setExpression(.8);audio.setTuning('GCF');audio.setProfile(profile);audio.setSound({brightness:1,body:-.5,presence:4.5});for(const [i,dir] of ['push','pull','push','pull'].entries())audio.scheduleNote('BTN_Melody_02',dir,.1+i*.65,.48);audio.scheduleNote('BTN_Melody_14','push',3,1.7);const result=await context.startRendering();audio.dispose();return [result.getChannelData(0),result.getChannelData(1)];}
function wav(data){const bytes=new ArrayBuffer(44+data[0].length*4),v=new DataView(bytes),str=(offset,value)=>[...value].forEach((c,i)=>v.setUint8(offset+i,c.charCodeAt(0)));str(0,'RIFF');v.setUint32(4,bytes.byteLength-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,48000,true);v.setUint32(28,192000,true);v.setUint16(32,4,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,bytes.byteLength-44,true);for(let i=0;i<data[0].length;i++)for(let c=0;c<2;c++)v.setInt16(44+i*4+c*2,Math.round(Math.max(-1,Math.min(1,data[c][i]))*32767),true);return new Blob([bytes],{type:'audio/wav'});}
document.querySelector('#run').onclick=async()=>{report.textContent='Renderizando…';try{const previous=await render('vallenato'),high=await render('vallenato-high'),a=stats(previous[0],10000,26000),b=stats(high[0],10000,26000),tail=stats(high[0],250000,280000),output=[new Float32Array(13*48000),new Float32Array(13*48000)];for(const [index,data] of [previous,high].entries()){const gain=.1/stats(data[0],4800,240000).rms;for(let c=0;c<2;c++)for(let i=0;i<data[c].length;i++)output[c][index*7*48000+i]=data[c][i]*gain;}const peak=Math.max(stats(output[0]).peak,stats(output[1]).peak);report.textContent=JSON.stringify({passed:b.highFrequencyRatio>a.highFrequencyRatio*1.01&&tail.rms<.00001&&peak<.98,previous:a,high:b,releaseTail:tail,comparisonPeak:peak,scope:'Actual production sampler renders at equal RMS; waveform frequency-weighted energy comparison, not a claim of identical Mezquite samples.'},null,2);const audio=document.createElement('audio'),link=document.createElement('a'),url=URL.createObjectURL(wav(output));audio.controls=true;audio.src=url;link.href=url;link.download='vallenato-anterior-agudo.wav';link.textContent='Descargar comparación';document.querySelector('#clips').replaceChildren(audio,link);}catch(error){report.textContent=JSON.stringify({passed:false,error:String(error)});}};document.querySelector('#run').disabled=false;
</script></html>
