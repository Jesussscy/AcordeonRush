<!doctype html><html lang="es"><meta charset="utf-8"><title>Reloj de referencia local</title><style>body{background:#101813;color:#f5e8ce;font:14px system-ui;padding:20px}pre{white-space:pre-wrap}iframe{width:1200px;height:900px;border:1px solid #666;max-width:100%}button{padding:15px;background:#e9b878;border:0}</style><h1>Partitura + audio propio: reloj compartido</h1><button id="run">Probar audio local y partitura</button><pre id="report">Lista.</pre><iframe src="/#practice" title="Aplicación con material propio"></iframe><script type="module">
import {createAccordionAudio} from '/src/recorded-accordion-audio.js';
const frame=document.querySelector('iframe'),out=document.querySelector('#report'),sleep=ms=>new Promise(r=>setTimeout(r,ms)),results=[];
const check=(value,label)=>{results.push({label,passed:Boolean(value)});if(!value)throw Error(label);out.textContent=JSON.stringify({running:true,results},null,2);};
async function until(fn){const start=performance.now();while(!fn()){if(performance.now()-start>12000)throw Error('Timeout '+fn);await sleep(20);}}
function encode(data,sr){const buffer=new ArrayBuffer(44+data.length*2),v=new DataView(buffer),write=(offset,s)=>{for(let i=0;i<s.length;i++)v.setUint8(offset+i,s.charCodeAt(i));};write(0,'RIFF');v.setUint32(4,36+data.length*2,true);write(8,'WAVE');write(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);write(36,'data');v.setUint32(40,data.length*2,true);data.forEach((n,i)=>v.setInt16(44+i*2,Math.max(-32767,Math.min(32767,Math.round(n*32767))),true));return buffer;}
document.querySelector('#run').onclick=async()=>{out.textContent='Iniciada: preparando audio de referencia…';try{
 const win=frame.contentWindow,doc=frame.contentDocument,$=s=>doc.querySelector(s),click=s=>$(s).click(),input=(el,value)=>{Object.getOwnPropertyDescriptor(el instanceof win.HTMLTextAreaElement?win.HTMLTextAreaElement.prototype:win.HTMLInputElement.prototype,'value').set.call(el,String(value));el.dispatchEvent(new win.Event('input',{bubbles:true}));el.dispatchEvent(new win.Event('change',{bubbles:true}));};
 await until(()=>$('[data-ready=true]')&&$('.p-unlock:not(:disabled)'));click('.p-unlock');
 const context=new OfflineAudioContext(1,48000*4,48000),audio=await createAccordionAudio({context,baseURL:new URL('/instrument/',location.origin)});await audio.preload();audio.setPlayingMode('direct');audio.setExpression(.8);audio.setTuning('GCF');audio.scheduleNote('BTN_Melody_13','push',0,.5);audio.scheduleNote('BTN_Melody_04','push',.6,.5);audio.scheduleNote('BTN_Melody_14','push',1.2,1);const rendered=await context.startRendering(),bytes=encode(rendered.getChannelData(0),48000);audio.dispose();
 const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(n=>n.toString(16).padStart(2,'0')).join('');
 [...doc.querySelectorAll('.p-tabs button')].find(b=>b.textContent.includes('Canciones')).click();await until(()=>$('.song-workspace'));await sleep(100);
 const material=doc.querySelectorAll('.song-advanced')[1];material.open=true;material.querySelector('details').open=true;
 const template=await fetch('/charts/chart-template.json').then(r=>r.json());template.media={filename:'reference-fixture.wav',sha256:hash,offset:0};input($('[aria-label="Editor de partitura JSON"]'),JSON.stringify(template));[...material.querySelectorAll('details button')].find(b=>b.textContent.includes('Validar')).click();await sleep(120);
 const transfer=new win.DataTransfer();transfer.items.add(new win.File([bytes],'reference-fixture.wav',{type:'audio/wav'}));const file=$('[aria-label="Cargar audio local"]');file.files=transfer.files;file.dispatchEvent(new win.Event('change',{bubbles:true}));await until(()=>$('audio')?.readyState>=1);
 const mode=$('[aria-label="Modo de canción"]');mode.value='watch';mode.dispatchEvent(new win.Event('change',{bubbles:true}));await sleep(70);click('.song-transport .p-primary');await until(()=>$('.song-workspace').dataset.phase==='playing');await until(()=>$('audio').currentTime>.3);
 const difference=Math.abs(Number($('.song-workspace').dataset.position)-$('audio').currentTime);results.push({position:$('.song-workspace').dataset.position,mediaTime:$('audio').currentTime,phase:$('.song-workspace').dataset.phase,paused:$('audio').paused,difference});check(difference<.06,'El audio local es el reloj del chart (error DOM <60 ms)');check($('audio').preservesPitch,'La velocidad conserva la altura de la referencia');
 click('.p-full-note button');await until(()=>$('.song-workspace').dataset.phase==='paused');const paused=$('audio').currentTime;await sleep(160);check(Math.abs($('audio').currentTime-paused)<.02,'Pausa detiene el audio local y el chart');click('[aria-label="Salir de pantalla grande"]');await sleep(100);
 input($('[aria-label="Posición musical"]'),1.65);await sleep(100);check(Math.abs($('audio').currentTime-1.65)<.04,'Buscar en el chart busca el mismo instante del audio local');
 input($('[aria-label="Tempo musical"]'),50);await sleep(40);click('.song-transport .p-primary');await until(()=>$('.song-workspace').dataset.phase==='playing');await until(()=>$('.practice-app').dataset.audioNotes.split(',').includes('64'));check($('audio').playbackRate===.5,'Tempo del medio y del instrumento comparten velocidad');check(true,'La nota sostenida Mi4 se reconstruye desde el medio local');click('.p-full-note button');await sleep(100);click('[aria-label="Salir de pantalla grande"]');await sleep(100);
 template.media.sha256='0'.repeat(64);input($('[aria-label="Editor de partitura JSON"]'),JSON.stringify(template));[...doc.querySelectorAll('.song-advanced details button')].find(b=>b.textContent.includes('Validar')).click();await sleep(120);click('.song-transport .p-primary');await until(()=>$('.song-notice').textContent.includes('SHA-256'));check(!$('.performance-view'),'Un audio incompatible se rechaza sin ocultar el error en pantalla grande');
 out.textContent=JSON.stringify({passed:true,fixture:'Original C-D-E exercise rendered by the production sampler, not commercial audio',localClockDifferenceSeconds:difference,checks:results.length,results},null,2);
 }catch(error){out.textContent=JSON.stringify({passed:false,error:String(error),results},null,2);}};
console.info('Local media clock QA ready');out.textContent='Preparada para medir.';
</script></html>
