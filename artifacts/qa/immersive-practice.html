<!doctype html><html lang="es"><meta charset="utf-8"><title>Fuelle, sonido agudo y pantalla completa</title><style>body{font:14px system-ui;background:#101813;color:#f5e8ce;padding:15px}iframe{width:1280px;height:800px;border:0;display:block}pre{white-space:pre-wrap}button{padding:12px}</style><button id="run" disabled>Validar práctica inmersiva</button><pre id="report">Lista.</pre><iframe allow="fullscreen 'none'" title="Aplicación real" src="/#practice"></iframe><script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#report'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{out.textContent='Midiendo…';const results=[];const check=(value,label,details)=>{results.push({label,passed:!!value,details});if(!value)throw Error(label);out.textContent=JSON.stringify({running:true,results},null,2);};const until=async fn=>{const start=performance.now();while(!fn()){if(performance.now()-start>15000)throw Error('Timeout '+fn);await sleep(25);}};try{
const win=frame.contentWindow,doc=frame.contentDocument,$=s=>doc.querySelector(s),root=()=>$('.practice-app'),key=(target,type,code,extra={})=>{const e=new win.KeyboardEvent(type,{code,key:code==='Space'?' ':code,bubbles:true,cancelable:true,...extra});target.dispatchEvent(e);return e;};await until(()=>$('[data-ready=true]')&&$('.p-unlock:not(:disabled)'));$('.p-unlock').click();await sleep(100);check($('[aria-label="Registro de práctica"]').value==='vallenato-high','Registro agudo inicial');
key(doc.body,'keydown','KeyW');await until(()=>root().dataset.audioNotes.split(',').includes('55'));check(root().dataset.audioNotes.split(',').includes('67'),'Cerrado: fundamental Sol3 y voz superior Sol4');
const normalY=win.scrollY;$('.p-unlock').focus({preventScroll:true});let event=key($('.p-unlock'),'keydown','Space');await until(()=>$('[data-ready=true]').dataset.direction==='pull');check(event.defaultPrevented,'Espacio se captura con un control enfocado');await until(()=>root().dataset.audioNotes.split(',').includes('57'));check(root().dataset.audioNotes.split(',').includes('69'),'Abierto: fundamental La3 y voz superior La4');check(win.scrollY===normalY,'El fuelle no desplaza la página');for(let i=0;i<5;i++)check(key($('.p-unlock'),'keydown','Space',{repeat:true}).defaultPrevented,'Se bloquea también la repetición de Espacio');key($('.p-unlock'),'keyup','Space');key(doc.body,'keyup','KeyW');await sleep(250);
Object.defineProperty(win.Element.prototype,'requestFullscreen',{configurable:true,value:()=>Promise.reject(new win.DOMException('Fixture measures viewport fallback','NotAllowedError'))});$('.p-focus-launch').click();await until(()=>$('.performance-view'));await sleep(150);check(true,'Vista inmersiva disponible sin fullscreen nativo');
for(const [width,height] of [[1280,800],[390,844],[844,390]]){frame.style.width=width+'px';frame.style.height=height+'px';await sleep(200);const stage=$('.p-stage').getBoundingClientRect(),keys=$('.p-keyboard').getBoundingClientRect(),app=root();check(stage.height>=70&&stage.bottom<=keys.top+1&&keys.bottom<=height+1,'Acordeón arriba y teclado debajo dentro del viewport',{width,height,stage:{top:stage.top,bottom:stage.bottom},keyboard:{top:keys.top,bottom:keys.bottom}});check(app.scrollHeight<=app.clientHeight+1,'La pantalla inmersiva no tiene desplazamiento vertical',{width,height,scrollHeight:app.scrollHeight,clientHeight:app.clientHeight});check(doc.querySelectorAll('.p-pad').length===31,'Se conservan los 31 botones',{width,height});}
frame.style.width='1280px';frame.style.height='800px';await sleep(150);for(const selector of ['.instrument-canvas','.p-pad','[aria-label="Salir de pantalla grande"]']){const target=$(selector);target.focus({preventScroll:true});const y=win.scrollY,scroll=root().scrollTop;event=key(target,'keydown','Space');await sleep(100);check(event.defaultPrevented&&!!$('.performance-view')&&$('[data-ready=true]').dataset.direction==='pull','Espacio abre sin salir de 3D ni activar el botón enfocado',{selector});check(root().scrollTop===scroll&&win.scrollY===y,'Espacio mantiene la posición',{selector});check(key(target,'keydown','Space',{repeat:true}).defaultPrevented,'Repetición retenida en pantalla grande',{selector});key(target,'keyup','Space');await sleep(80);check($('[data-ready=true]').dataset.direction==='push','Soltar Espacio recupera cerrado',{selector});}
const pad=$('.p-pad');pad.focus({preventScroll:true});key(pad,'keydown','Space');key(pad,'keydown','ShiftLeft',{shiftKey:true});await sleep(100);check($('[data-ready=true]').dataset.direction==='push','Mayús + Espacio selecciona cerrado');key(pad,'keyup','ShiftLeft');await sleep(80);check($('[data-ready=true]').dataset.direction==='pull','Soltar Mayús mantiene Espacio abierto');key(pad,'keyup','Space');check(!doc.querySelector('.p-pad[aria-pressed=true]'),'Espacio no pulsa una tecla melódica enfocada');$('[aria-label="Salir de pantalla grande"]').click();await sleep(80);check(!$('.performance-view')&&doc.documentElement.style.overflow!=='hidden','Salir restaura la página');
out.textContent=JSON.stringify({passed:true,checks:results.length,scope:'Mounted application with cancelable keyboard events. Native fullscreen explicitly rejected to measure 1280x800, 390x844 and 844x390 iframe layouts. Real native key input and fullscreen checked separately.',results},null,2);
}catch(error){out.textContent=JSON.stringify({passed:false,error:String(error),results},null,2);}};
document.querySelector('#run').disabled=false;
</script></html>
