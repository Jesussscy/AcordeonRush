<!doctype html><html lang="es"><meta charset="utf-8"><title>Comparación de voces del acordeón</title><style>body{background:#101813;color:#f5e8ce;font:15px system-ui;padding:24px}button,a{padding:12px;color:#e9b878}pre{white-space:pre-wrap}audio{display:block;width:100%;max-width:600px;margin:10px 0}</style><h1>Comparación del acordeón</h1><p>Ejercicio original Do–Mi–Sol. A: Natural. B: Vallenato virtual. Ambos fragmentos se ajustan al mismo RMS para comparar el timbre sin favorecer al más fuerte. No es una grabación comercial ni una certificación de realismo.</p><button id="run" disabled>Generar comparación y medir</button><pre id="report">Lista.</pre><div id="clips"></div><script type="module">
import {createAccordionAudio} from '/src/recorded-accordion-audio.js';
const report=document.querySelector('#report'),clips=document.querySelector('#clips'),results=[];
const stats=(data,a=0,b=data.length)=>{let square=0,peak=0;for(let i=a;i<b;i++){square+=data[i]**2;peak=Math.max(peak,Math.abs(data[i]));}return {rms:Math.sqrt(square/(b-a)),peak};};
function wav(channels){const length=channels[0].length,buffer=new ArrayBuffer(44+length*4),v=new DataView(buffer),write=(a,s)=>[...s].forEach((c,i)=>v.setUint8(a+i,c.charCodeAt(0)));write(0,'RIFF');v.setUint32(4,36+length*4,true);write(8,'WAVE');write(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,48000,true);v.setUint32(28,192000,true);v.setUint16(32,4,true);v.setUint16(34,16,true);write(36,'data');v.setUint32(40,length*4,true);for(let i=0;i<length;i++)for(let c=0;c<2;c++)v.setInt16(44+i*4+c*2,Math.round(Math.max(-1,Math.min(1,channels[c][i]))*32767),true);return new Blob([buffer],{type:'audio/wav'});}
async function render(profile,{button='BTN_Melody_14',direction='push',tuning='GCF',width=.55,phrase=false,expression=.8}={}){const context=new OfflineAudioContext(2,48000*(phrase?5:3),48000),audio=await createAccordionAudio({context,baseURL:new URL('/instrument/',location.origin)});await audio.preload();audio.setPlayingMode('direct');audio.setTuning(tuning);audio.setProfile(profile);audio.setReedWidth(width);audio.setExpression(expression);if(phrase){for(const [i,key] of ['13','14','15','14','13'].entries())audio.scheduleNote('BTN_Melody_'+key,'push',.1+i*.48,.33);audio.scheduleNote('BTN_Melody_15','push',2.7,1.5);}else audio.scheduleNote(button,direction,.1,1.8);const data=await context.startRendering();audio.dispose();return [data.getChannelData(0),data.getChannelData(1)];}
document.querySelector('#run').onclick=async()=>{try{results.length=0;clips.replaceChildren();
const check=(passed,label,details)=>{results.push({label,passed,details});if(!passed)throw Error(label);report.textContent=JSON.stringify({running:true,checks:results.length},null,2);};
for(const direction of ['push','pull'])for(const [part,button] of [['melody','BTN_Melody_14'],['bass','BTN_Bass_01'],['chord','BTN_Bass_02']]){const data=await render('vallenato',{button,direction}),signal=stats(data[0],24000,72000),tail=stats(data[0],120000);check(signal.rms>.003,`${part} ${direction}: salida`,signal);check(signal.peak<.98,`${part} ${direction}: sin recorte`,signal);check(tail.rms<.00001,`${part} ${direction}: silencio tras soltar`,tail);}
for(const [tuning,button] of [['DGC-low','BTN_Bass_01'],['BEA','BTN_Melody_31']]){const data=await render('vallenato',{tuning,button}),signal=stats(data[0],24000,72000);check(signal.rms>.002&&signal.peak<.98,`${tuning}: registro extremo`,signal);}
const dry=await render('natural',{phrase:true}),ensemble=await render('vallenato',{phrase:true});const output=[new Float32Array(48000*11),new Float32Array(48000*11)];for(const [index,data] of [dry,ensemble].entries()){const rms=stats(data[0],4800,220000).rms,scale=.1/rms;for(let c=0;c<2;c++)for(let i=0;i<data[c].length;i++)output[c][index*48000*6+i]=data[c][i]*scale;}
const difference=Math.sqrt(dry[0].reduce((sum,n,i)=>sum+(n-ensemble[0][i])**2,0)/dry[0].length);check(difference>.005,'Natural y Vallenato generan señales distintas',{differenceRms:difference});const url=URL.createObjectURL(wav(output)),player=document.createElement('audio'),link=document.createElement('a');player.controls=true;player.src=url;link.href=url;link.download='acordeon-natural-vallenato.wav';link.textContent='Descargar comparación A–B';clips.append(player,link);check(Math.max(stats(output[0]).peak,stats(output[1]).peak)<.98,'Comparación normalizada sin recorte');
const zero=await render('vallenato',{width:0}),wide=await render('vallenato',{width:1});check(Math.sqrt(zero[0].reduce((sum,n,i)=>sum+(n-wide[0][i])**2,0)/zero[0].length)>.003,'Apertura de voces modifica el audio');
const soft=await render('vallenato',{expression:.15}),strong=await render('vallenato',{expression:.95}),softRms=stats(soft[0],24000,72000).rms,strongRms=stats(strong[0],24000,72000).rms;let toneDifference=0;for(let i=24000;i<72000;i++)toneDifference+=(soft[0][i]/softRms-strong[0][i]/strongRms)**2;toneDifference=Math.sqrt(toneDifference/48000);check(toneDifference>.001,'La expresión modifica el timbre, además del volumen',{normalizedDifference:toneDifference});
report.textContent=JSON.stringify({passed:true,checks:results.length,scope:'Production Web Audio renders and waveform measurements. A/B demo has equal RMS. Human authenticity remains for listener evaluation.',results},null,2);
}catch(error){report.textContent=JSON.stringify({passed:false,error:String(error),results},null,2);}};
document.querySelector('#run').disabled=false;
</script></html>
