<!doctype html><html lang="es"><meta charset="utf-8"><title>AcordenRush · flujo integrado</title><style>body{background:#101813;color:#f5e8ce;font:14px system-ui;padding:22px}button{padding:14px;background:#e9b878;border:0;border-radius:8px}pre{white-space:pre-wrap}iframe{width:1200px;height:900px;max-width:100%;border:1px solid #777}</style><h1>Instrumento, canciones y modelos actualizados</h1><button id="run">Probar el flujo completo</button><pre id="report">Lista.</pre><iframe src="/#practice" title="Aplicación en prueba"></iframe><script type="module">

 const win=frame.contentWindow,doc=frame.contentDocument,$=s=>doc.querySelector(s),click=s=>$(s).click(),select=(label,value)=>{const element=$(`[aria-label="${label}"]`);if(!element)throw Error('Missing '+label);element.value=value;element.dispatchEvent(new win.Event('change',{bubbles:true}));},input=(selector,value)=>{const el=$(selector),setter=Object.getOwnPropertyDescriptor(el instanceof win.HTMLTextAreaElement?win.HTMLTextAreaElement.prototype:win.HTMLInputElement.prototype,'value').set;setter.call(el,String(value));el.dispatchEvent(new win.Event('input',{bubbles:true}));el.dispatchEvent(new win.Event('change',{bubbles:true}));};

 select('Afinación de práctica','GCF');await sleep(60);
 const codes=['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash','Quote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal'];
 for(const code of codes){key('keydown',code);await sleep(25);const b=allButtons.find(b=>b.bone===keyboardButton(code).name);check($('.instrument-3d').dataset.activeButtons.split(',').includes(b.id),'Tecla conecta con el modelo: '+code);key('keyup',code);await sleep(15);}
 key('keydown','KeyW');await sleep(100);const pad=$('[data-note-id="melody-0-1"]');pad.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true}));key('keyup','KeyW');await sleep(100);check($('.instrument-3d').dataset.activeButtons.includes('melody-0-1'),'Dos orígenes: soltar uno conserva el botón');pad.dispatchEvent(new win.KeyboardEvent('keyup',{key:'Enter',code:'Enter',bubbles:true}));await sleep(80);check(!$('.instrument-3d').dataset.activeButtons,'El último origen libera el botón');

 [...doc.querySelectorAll('.p-tabs button')].find(b=>b.textContent.includes('Canciones')).click();await until(()=>$('.song-workspace'));await sleep(100);check($('[aria-label="Afinación de práctica"]').value==='BEA','Las locuras mías configura B/E/A para el ejercicio');
 const expected=['BEA','GCF','DGC','FBbEb','EAD'];for(let i=0;i<5;i++){doc.querySelectorAll('.song-library-grid>button')[i].click();await sleep(80);check($('[aria-label="Afinación de práctica"]').value===expected[i],'Configuración automática de canción '+(i+1));}
 doc.querySelectorAll('.song-library-grid>button')[0].click();await sleep(100);select('Modo de canción','watch');await sleep(60);click('.song-transport .p-primary');await until(()=>$('.song-workspace').dataset.phase==='playing');await until(()=>Number($('.song-workspace').dataset.position)>.1&&Number(root().dataset.audioRms)>.002&&$('.instrument-3d').dataset.activeButtons);
 check(true,'Ver tocar: audio real, notas y botones sincronizados');check(!!$('.performance-view'),'Ver tocar abre la vista grande');check($('.p-full-note').textContent.includes('Pausar canción'),'Transporte accesible dentro de pantalla grande');
 click('.p-full-note button');await until(()=>$('.song-workspace').dataset.phase==='paused');const paused=Number($('.song-workspace').dataset.position);await sleep(250);check(Number($('.song-workspace').dataset.position)===paused&&Number(root().dataset.audioRms)<.001,'Pausa congela posición y silencia salida real');

 select('Modo de canción','watch');await sleep(60);click('.song-transport .p-primary');await until(()=>Number($('.song-workspace').dataset.position)>1.35&&Number($('.song-workspace').dataset.position)<2.15);check($('.instrument-3d').dataset.activeButtons.includes('melody-1-3'),'Partitura aportada: Mi4 activa M14 real');click('.p-full-note button');await sleep(70);click('[aria-label="Salir de pantalla grande"]');await sleep(80);input('[aria-label="Posición musical"]',1.7);await sleep(50);click('.song-transport .p-primary');await until(()=>$('.song-workspace').dataset.phase==='playing');await until(()=>root().dataset.audioNotes.split(',').includes('64'));check(true,'Buscar dentro de Mi4 reanuda su sonido sostenido');click('.p-full-note button');await sleep(80);click('[aria-label="Salir de pantalla grande"]');await sleep(80);
 const loopDetails=doc.querySelectorAll('.song-advanced')[0];loopDetails.open=true;const numbers=loopDetails.querySelectorAll('input[type=number]');input('input[type=number]',.6);const setter=Object.getOwnPropertyDescriptor(win.HTMLInputElement.prototype,'value').set;setter.call(numbers[1],'1.1');numbers[1].dispatchEvent(new win.Event('input',{bubbles:true}));numbers[1].dispatchEvent(new win.Event('change',{bubbles:true}));loopDetails.querySelector('input[type=checkbox]').click();input('[aria-label="Posición musical"]',.9);await sleep(60);click('.song-transport .p-primary');await until(()=>Number($('.song-workspace').dataset.position)>.92);await until(()=>Number($('.song-workspace').dataset.position)<.75);check(true,'Bucle A-B reconstruye reloj, notas y fuelle');click('.p-full-note button');await sleep(100);click('[aria-label="Salir de pantalla grande"]');await sleep(100);
 check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth,'Sin desbordamiento horizontal del documento');out.textContent=JSON.stringify({passed:true,checks:results.length,results},null,2);
 }catch(error){out.textContent=JSON.stringify({passed:false,error:String(error),results},null,2);}finally{if(saved===null)localStorage.removeItem('acordenrush-design');else localStorage.setItem('acordenrush-design',saved);}};
</script></html>
