<!doctype html><html lang="es"><meta charset="utf-8"><title>AcordenRush · Verificación de práctica</title><style>body{background:#101813;color:#f5e8ce;font:14px system-ui;margin:24px}button{background:#e9b878;border:0;border-radius:8px;padding:14px 22px;font:inherit;cursor:pointer}pre{white-space:pre-wrap}iframe{width:1200px;height:800px;border:1px solid #777;max-width:100%}.pass{color:#b5e59e}.fail{color:#ff9b8a}</style><h1>Verificación funcional de práctica</h1><p>Pruebas contra la aplicación real en un iframe y muestras locales decodificadas con Web Audio. Los eventos automatizados no sustituyen una prueba física del teclado ni un dispositivo móvil real.</p><button id="run">Ejecutar comprobaciones</button><pre id="report" role="status">Lista para ejecutar.</pre><iframe src="/#practice" title="Aplicación de práctica en prueba"></iframe><script type="module">
import {keyboardButton,lessonFor} from '/src/practice.ts';
import {songs} from '/src/songs.ts';
import {createAccordionAudio} from '/src/recorded-accordion-audio.js';
const output=document.querySelector('#report'),frame=document.querySelector('iframe'),report=[];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const check=(condition,label)=>{if(!condition)throw Error(label);report.push({label,passed:true});output.textContent=JSON.stringify(report,null,2);};
async function until(fn,timeout=15000){const at=performance.now();while(!fn()){if(performance.now()-at>timeout)throw Error('Timeout: '+fn);await sleep(30);}}
document.querySelector('#run').onclick=async()=>{
 report.length=0;output.className='';const savedDesign=localStorage.getItem('acordenrush-design');try{
 await until(()=>frame.contentDocument.querySelector('.p-pad'));
 const win=frame.contentWindow,doc=frame.contentDocument,$=s=>doc.querySelector(s),click=s=>$(s).click(),select=(label,value)=>{const el=$(`[aria-label="${label}"]`);el.value=value;el.dispatchEvent(new win.Event('change',{bubbles:true}));};
 const down=(code,shiftKey=false)=>doc.body.dispatchEvent(new win.KeyboardEvent('keydown',{code,key:code.replace('Key',''),bubbles:true,shiftKey})),up=(code,shiftKey=false)=>doc.body.dispatchEvent(new win.KeyboardEvent('keyup',{code,key:code.replace('Key',''),bubbles:true,shiftKey}));
 await until(()=>$('[data-ready=true]'));check(doc.querySelectorAll('.p-pad').length===31,'31 melodías visibles');check([...doc.querySelectorAll('[data-row-count]')].map(e=>e.dataset.rowCount).join('/')==='10/11/10','Tres hileras 10/11/10');
 down('KeyQ');await sleep(80);check($('[data-note-id="melody-0-0"]').getAttribute('aria-pressed')==='true','Q hunde y resalta M1');check($('.instrument-3d').dataset.activeButtons.includes('melody-0-0'),'La misma pulsación llega al modelo 3D');up('KeyQ');await sleep(60);check(!$('.instrument-3d').dataset.activeButtons,'Soltar Q libera el modelo');check($('.instrument-3d').dataset.direction==='push','Inicio cerrado sin mantener espacio');click('.p-bellows>div>button:first-child');await sleep(40);down('KeyQ');await sleep(40);check($('.p-live').textContent.includes('Re♯4')&&$('.instrument-3d').dataset.bellows==='true','Nota abierta directa sin espacio');up('KeyQ');click('.p-bellows>div>button:nth-child(2)');await sleep(40);
 select('Idioma del teclado','en');await sleep(40);check($('[data-note-id="melody-1-9"] kbd').textContent===';','Etiquetas inglesas correctas');select('Idioma del teclado','es');
 const codes=['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP','KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash','Quote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0','Minus','Equal'];
 for(const code of codes){down(code,true);await sleep(20);const bone=keyboardButton(code).name,id=bone.includes('Melody')?(()=>{const n=Number(bone.slice(-2));return n<=10?`melody-0-${n-1}`:n<=21?`melody-1-${n-11}`:`melody-2-${n-22}`;})():`bass-${Number(bone.slice(-2))-1}`;check($('.instrument-3d').dataset.activeButtons.split(',').includes(id),`Shift + ${code}: botón correcto`);up(code,true);await sleep(10);}
 click('.p-bellows input');await sleep(50);down('Space');await sleep(40);check($('.instrument-3d').dataset.direction==='pull'&&$('.instrument-3d').dataset.bellows==='true','Espacio abre el fuelle manual');down('ShiftLeft',true);await sleep(40);check($('.instrument-3d').dataset.direction==='push','Mayús cambia el fuelle a cerrar sin soltar espacio');up('ShiftLeft');up('Space');await sleep(40);check($('.instrument-3d').dataset.bellows==='false','Soltar espacio corta el aire');
 click('.p-section-tabs button:nth-child(2)');await sleep(30);check(doc.querySelectorAll('.p-bass-keys .p-pad').length===6,'Seis bajos en su sección');click('.p-section-tabs button:nth-child(3)');await sleep(30);check(doc.querySelectorAll('.p-bass-keys .p-pad').length===6,'Seis acordes en su sección');click('.p-section-tabs button:first-child');
 select('Afinación de práctica','ADG');await sleep(40);check($('.p-system').textContent.includes('A/D/G'),'Afinación visible y actualizada');select('Registro de práctica','musette');await sleep(40);check($('.p-system').textContent.includes('Musette'),'Registro visible y actualizado');
 click('.p-scene-caption button');await sleep(40);const designButtons=[...doc.querySelectorAll('.p-collection>div>button')];for(const button of designButtons.slice(0,2)){button.click();await until(()=>$('[data-ready=true]')?.dataset.model===button.querySelector('strong').textContent);check(true,'Modelo texturizado cargado: '+button.querySelector('strong').textContent);}designButtons[0].click();await until(()=>$('[data-ready=true]')?.dataset.model==='Curva Zafiro');
 click('#listen-tab');await sleep(50);click('.p-primary');await until(()=>$('.p-transport>b').textContent==='Reproduciendo');await until(()=>$('.instrument-3d').dataset.activeButtons);check($('.instrument-3d').dataset.bellows==='true','Demo: fuelle y notas sincronizados');check(doc.querySelectorAll('.p-pad[aria-pressed=true]').length>0,'Demo: botones visuales activos');click('.p-primary');await sleep(80);const paused=$('.p-transport progress').value;await sleep(160);check($('.p-transport progress').value===paused&&!$('.instrument-3d').dataset.activeButtons,'Pausa congela reloj y libera voces y botones');click('.p-primary');await until(()=>$('.p-transport progress').value>paused+100);check(true,'Continuar conserva la posición');click('[aria-label="Reiniciar práctica"]');await sleep(60);check($('.p-transport progress').value===0,'Reiniciar vuelve al inicio');
 click('#practice-tab');await sleep(50);select('Tipo de práctica','guided');select('Afinación de práctica','GCF');await sleep(60);click('.p-bellows input');await sleep(30);[...doc.querySelectorAll('.p-bellows>div>button')][0].click();click('.p-primary');await until(()=>$('.p-transport>b').textContent==='Reproduciendo');const first=lessonFor(songs[0],'GCF','beginner','first')[0],firstCode=codes.find(code=>keyboardButton(code).name===first.button.name);await until(()=>$('.p-transport progress').value>=first.time-20);down(firstCode);await sleep(70);up(firstCode);await sleep(70);check($('.p-live').textContent.includes('soltaste antes'),'Soltar nota sostenida antes muestra una señal comprensible');check(doc.querySelectorAll('.p-stats b')[1].textContent==='1','Nota cortada cuenta como error');click('[aria-label="Reiniciar práctica"]');await sleep(50);
 click('.p-primary');await until(()=>$('.p-transport>b').textContent==='Reproduciendo');await until(()=>$('.p-transport progress').value>=first.time-20);down(firstCode);await until(()=>Number(doc.querySelector('.p-stats b').textContent)>0);up(firstCode);check(true,'Sostener hasta el final otorga acierto con el reloj de canción');click('[aria-label="Reiniciar práctica"]');await sleep(50);
 const offline=new OfflineAudioContext(1,44100*.7,44100),a=await createAccordionAudio({context:offline,baseURL:new URL('/instrument/',location.origin)});await a.preload();a.setTuning('GCF');a.setProfile('musette');a.setVolume(.7);a.setBellows('pull',.8);a.noteOn('BTN_Melody_01');await sleep(40);const rendered=await offline.startRendering(),samples=rendered.getChannelData(0),rms=Math.sqrt(samples.reduce((sum,v)=>sum+v*v,0)/samples.length);check(rms>.001,`Grabaciones WAV decodificadas y audio no silencioso: RMS ${rms.toFixed(5)}`);a.dispose();
 check(doc.documentElement.scrollWidth<=doc.documentElement.clientWidth,'Sin desbordamiento horizontal en escritorio');output.className='pass';output.textContent=JSON.stringify({passed:true,checks:report.length,results:report},null,2);
 }catch(error){output.className='fail';output.textContent=JSON.stringify({passed:false,error:String(error),results:report},null,2);}finally{if(savedDesign===null)localStorage.removeItem('acordenrush-design');else localStorage.setItem('acordenrush-design',savedDesign);}
};
</script></html>
