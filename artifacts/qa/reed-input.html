<!doctype html><html lang="es"><meta charset="utf-8"><title>Voces y teclado real</title><button id="run">Probar voces y teclado</button><pre id="report">Lista.</pre><iframe src="/#practice" title="Aplicación real" style="width:1200px;height:900px"></iframe><script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('#report'),sleep=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('#run').onclick=async()=>{out.textContent='Midiendo…';const results=[];const check=(ok,label)=>{results.push({label,passed:!!ok});if(!ok)throw Error(label);};const until=async fn=>{const start=performance.now();while(!fn()){if(performance.now()-start>12000)throw Error('Timeout '+fn);await sleep(20);}};try{const win=frame.contentWindow,doc=frame.contentDocument,$=s=>doc.querySelector(s),root=()=>$('.practice-app'),click=text=>[...doc.querySelectorAll('.p-sound button')].find(b=>b.textContent===text).click();await until(()=>$('[data-ready=true]'));$('.p-sound').open=true;check($('[aria-label="Registro de práctica"]').value==='vallenato','Vallenato es el registro inicial');check($('[aria-label="Apertura de voces"]').value==='0.55','Control de apertura disponible');click('Probar Natural');await until(()=>Number(root().dataset.audioRms)>.003);check($('[aria-label="Registro de práctica"]').value==='natural','Prueba Natural usa el registro base');check(doc.querySelectorAll('.p-pad[aria-pressed=true]').length>0,'La prueba mueve los botones reales');click('Probar Vallenato');await until(()=>$('[aria-label="Registro de práctica"]').value==='vallenato'&&Number(root().dataset.audioRms)>.003);check(true,'Prueba Vallenato cambia registro y produce señal');click('Detener prueba');await sleep(700);check(Number(root().dataset.audioRms)<.001,'Detener cancela el sonido');await sleep(2300);check(Number(root().dataset.audioRms)<.001&&!doc.querySelector('.p-pad[aria-pressed=true]'),'No reaparecen notas pendientes tras detener');click('Probar Vallenato');await sleep(200);doc.body.dispatchEvent(new win.KeyboardEvent('keydown',{code:'KeyW',bubbles:true}));await sleep(1100);check(root().dataset.audioNotes==='55','El teclado interrumpe la prueba y conserva solo la nota tocada');doc.body.dispatchEvent(new win.KeyboardEvent('keyup',{code:'KeyW',bubbles:true}));await sleep(700);check(Number(root().dataset.audioRms)<.001,'Soltar la tecla devuelve el silencio');out.textContent=JSON.stringify({passed:true,checks:results.length,scope:'Actual mounted app, sampler output meter, preview input ownership and physical keyboard event route.',results},null,2);}catch(error){out.textContent=JSON.stringify({passed:false,error:String(error),results},null,2);}};
out.textContent='Preparada.';
</script></html>
