<!doctype html><html><meta charset="utf-8"><title>Brillo del acordeón</title><button id="run" disabled>Medir brillo</button><pre id="report">Lista.</pre><script type="module">
import {createAccordionAudio} from '/src/recorded-accordion-audio.js';
const out=document.querySelector('#report');document.querySelector('#run').onclick=async()=>{try{const cases=[];for(const presence of [0,4.5]){const context=new OfflineAudioContext(2,96000,48000),audio=await createAccordionAudio({context,baseURL:new URL('/instrument/',location.origin)});await audio.preload();audio.setPlayingMode('direct');audio.setExpression(.8);audio.setTuning('GCF');audio.setProfile('vallenato');audio.setSound({brightness:1,body:-.5,presence});audio.scheduleNote('BTN_Melody_14','push',.1,1.2);const data=(await context.startRendering()).getChannelData(0);let square=0,slope=0,peak=0;for(let i=12000;i<48000;i++){square+=data[i]**2;slope+=(data[i]-data[i-1])**2;peak=Math.max(peak,Math.abs(data[i]));}cases.push({presence,rms:Math.sqrt(square/36000),relativeHighFrequencyEnergy:slope/square,peak});audio.dispose();}const brighter=cases[1].relativeHighFrequencyEnergy>cases[0].relativeHighFrequencyEnergy*1.01;out.textContent=JSON.stringify({passed:brighter&&cases.every(c=>c.peak<.98),method:'Measured first-difference energy divided by signal energy: a frequency-weighted waveform metric independent of overall gain. Not a subjective listening claim.',cases},null,2);}catch(error){out.textContent=JSON.stringify({passed:false,error:String(error)});}};document.querySelector('#run').disabled=false;
</script></html>
